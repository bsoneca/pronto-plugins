# Publishes the identity broker's runtime (identity/publish.sh, built with crane, no Docker) from
# Actions: ghcr.io/bsoneca/pronto-identity:<version> for linux/amd64 and linux/arm64,
# the broker's code at the pushed commit, composed exactly as publish.sh composes it (it runs
# publish.sh itself). A version once published never changes: publish.sh reuses what is there.
#
# Push the commit to publish as a branch named `publish-identity/v<version>`:
#   git push origin <sha>:refs/heads/publish-identity/v0.1.2
# The run's summary prints the image and its digest, which an app names as bin/pronto-identity's
# frontImage=ghcr.io/bsoneca/pronto-identity:<version>@sha256:…
name: publish-identity
on:
  push:
    branches: ['publish-identity/v*']
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/bsoneca/pronto-identity
  CRANE_VERSION: v0.20.2
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: version
        run: |
          v="${GITHUB_REF_NAME#publish-identity/v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a version: $v" >&2; exit 1; }
          echo "V=$v" >> "$GITHUB_ENV"
      # publish.sh builds with crane, no Docker (PRONTO-180).
      - name: crane
        run: curl -sSL "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz" | sudo tar xz -C /usr/local/bin crane
      # The run's token writes the package only once the package grants this repository's Actions write
      # (its settings, Manage Actions access: the owner's step); until then GHCR_TOKEN, a token with
      # write:packages. Without either the push is refused (write_package), as 0.2.1, 0.2.2 and 0.2.4
      # were; publish.sh runs as well from a machine logged in to ghcr.io (crane auth login).
      - name: registry
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | crane auth login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: publish
        # bash, not the default bash -e: pipefail, so a refused push fails the run rather than tee hiding it.
        shell: bash
        run: sh identity/publish.sh "$V" | tee -a "$GITHUB_STEP_SUMMARY"
