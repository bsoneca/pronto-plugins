[settings]
lockfile = true

[tools]
# The CUE pronto pins; exports must be byte-identical everywhere.
"github:cue-lang/cue" = "0.16.1"
# The iOS host's generator and linter (ios/host.cue pins the same two for an app); xcodebuild is Xcode's own,
# so both are Mac tools only and a Linux runner never installs them.
"aqua:yonaskolb/XcodeGen" = { version = "2.48.0", os = ["macos"] }
"aqua:realm/SwiftLint" = { version = "0.65.1", os = ["macos"] }
