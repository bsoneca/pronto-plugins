name: gradle-cache
description: |
  Keep Gradle's dependency cache in GitHub's cache service, so a run fetches only what changed
  (Maven Central answered 429 when every run downloaded all of it). The jobs run on GitHub-hosted
  runners, whose disks are empty each run. The cache is saved by runs on main and read-only on pull
  requests, so a fork's pull request cannot poison it. It holds downloaded artifacts only. Run it
  after checkout, before Gradle.
runs:
  using: composite
  steps:
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
