# This repository's pull requests move their issues on bsoneca/pronto's board, through the board's
# one workflow (devflow-board.yml, PRONTO-479). Here it is this branch's copy, so a pull request that
# changes it runs what it changes. The token is the PLANE_TOKEN secret, the same token
# bsoneca/pronto's holds (Secret Manager's plane-api-token).

name: plane

on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited, closed]

permissions:
  contents: read

jobs:
  board:
    uses: ./.github/workflows/devflow-board.yml
    secrets:
      PLANE_TOKEN: ${{ secrets.PLANE_TOKEN }}
