name: gradle-cache
description: |
  Keep Gradle's dependency cache in GitHub's cache service, so a run fetches only what changed
  (Maven Central answered 429 when every run downloaded all of it). The jobs run on GitHub-hosted
  runners, whose disks are empty each run. GitHub scopes caches by ref: a pull request reads main's
  cache and can only write one of its own, which main never reads, so a fork's pull request cannot
  poison it. It holds downloaded artifacts only. Run it after checkout, before Gradle.
runs:
  using: composite
  steps:
    - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('android/template/**/*.gradle*', 'examples/hello-android/android/**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml', 'examples/hello-android/.config/mise/mise.lock') }}
        restore-keys: |
          gradle-${{ runner.os }}-
